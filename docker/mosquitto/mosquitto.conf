listener 1883
protocol mqtt

# Internal-only broker (not exposed beyond the docker network's trust
# boundary in production); anonymous access is fine here since it never
# leaves geedsan-network in the default setup. Add a password_file and
# set allow_anonymous false if 1883 needs to be reachable from outside.
allow_anonymous true
max_connections -1

persistence true
persistence_location /mosquitto/data/
persistence_file mosquitto.db
autosave_interval 300

log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
connection_messages true
log_timestamp true
