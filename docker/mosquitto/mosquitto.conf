listener 1883
protocol mqtt

# Authenticated access — password file generated via mosquitto_passwd.
# Credentials: geedsan (backend), chirpstack (chirpstack integration).
allow_anonymous false
password_file /mosquitto/config/passwd
max_connections -1

persistence true
persistence_location /mosquitto/data/
persistence_file mosquitto.db
autosave_interval 300

log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
connection_messages true
log_timestamp true
