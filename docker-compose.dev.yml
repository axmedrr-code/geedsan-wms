# NUWACO WMS — Development Docker Compose
# Target: Ubuntu Server 24.04 LTS, running side-by-side with docker-compose.prod.yml
# on the same VPS from a SEPARATE clone (/opt/geedsan-dev).
#
# Isolation from production:
#   - Separate compose project (derived from the /opt/geedsan-dev directory name)
#   - Separate network (geedsan_dev_network, not external — unrelated to prod's geedsan_default)
#   - Separate, explicitly-named volumes (geedsan_dev_*)
#   - Every service on a different host port than production publishes
#   - No static IPs / network_mode hacks — Linux bridge DNS resolves correctly
#     (same clean pattern already proven in docker-compose.prod.yml)
#
# Usage:
#   docker compose -f docker-compose.dev.yml --env-file .env.dev up -d
#   (or: ./scripts/dev-up.sh)

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: geedsan-dev-postgres
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      POSTGRES_DB:            geedsan_wms_dev
      POSTGRES_USER:           geedsan_dev
      POSTGRES_PASSWORD:       ${DB_PASSWORD}
      CHIRPSTACK_DB_PASSWORD:  ${CHIRPSTACK_DB_PASSWORD}
    volumes:
      - geedsan_dev_postgres_data:/var/lib/postgresql/data
      # Same init script as production — already parameterized via env vars,
      # no dev-specific fork needed.
      - ./deploy/postgres/init-chirpstack.sh:/docker-entrypoint-initdb.d/10-chirpstack.sh:ro
    ports:
      - "5433:5432"
    networks:
      - geedsan-dev-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geedsan_dev -d geedsan_wms_dev"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: geedsan-dev-redis
    restart: unless-stopped
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - geedsan_dev_redis_data:/data
    ports:
      - "6380:6379"
    networks:
      - geedsan-dev-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Mosquitto MQTT ──────────────────────────────────────────────────────────
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: geedsan-dev-mosquitto
    restart: unless-stopped
    volumes:
      # Same mosquitto.conf as production. The passwd file is generated by
      # scripts/dev-up.sh (dev-specific logic, doesn't touch production's
      # deploy/scripts/generate-mqtt-passwd.sh) — see docs/DEV_ENVIRONMENT.md
      - ./deploy/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./deploy/mosquitto/passwd:/mosquitto/config/passwd:ro
      - geedsan_dev_mosquitto_data:/mosquitto/data
      - geedsan_dev_mosquitto_log:/mosquitto/log
    ports:
      - "1884:1883"
    networks:
      - geedsan-dev-network
    healthcheck:
      test: ["CMD-SHELL", "echo '' | nc -w 1 localhost 1883 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Backend (Node.js) ───────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: nuwaco-backend:dev
    container_name: geedsan-dev-backend
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      NODE_ENV:             development
      PORT:                 5000
      DB_HOST:              postgres
      DB_PORT:              5432
      DB_NAME:              geedsan_wms_dev
      DB_USER:              geedsan_dev
      DB_PASSWORD:          ${DB_PASSWORD}
      JWT_SECRET:           ${JWT_SECRET}
      JWT_REFRESH_SECRET:   ${JWT_REFRESH_SECRET}
      FRONTEND_URL:         ${FRONTEND_URL:-http://localhost:3000}
      ODOO_URL:             http://odoo:8069
      ODOO_DB:              odoo
      ODOO_USERNAME:        ${ODOO_USERNAME}
      ODOO_API_KEY:         ${ODOO_API_KEY}
      ODOO_PASSWORD:        ${ODOO_PASSWORD}
      MQTT_BROKER:          mqtt://mosquitto:1883
      MQTT_CLIENT_ID:       geedsan-dev-backend
      MQTT_USERNAME:        ${MQTT_USERNAME}
      MQTT_PASSWORD:        ${MQTT_PASSWORD}
      CHIRPSTACK_URL:       http://chirpstack:8080
      CHIRPSTACK_API_KEY:   ${CHIRPSTACK_API_KEY}
    volumes:
      - geedsan_dev_backend_uploads:/app/uploads
      - geedsan_dev_backend_reports:/app/reports
      - geedsan_dev_backend_logs:/app/logs
    ports:
      - "5000:5000"
    networks:
      - geedsan-dev-network
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── Frontend (Next.js) ──────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5000
    image: nuwaco-frontend:dev
    container_name: geedsan-dev-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      HOSTNAME:  0.0.0.0
    ports:
      - "3000:3000"
    networks:
      - geedsan-dev-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/',r=>{process.exit(r.statusCode<400?0:1)}).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Odoo ERP ────────────────────────────────────────────────────────────────
  odoo:
    image: odoo:18.0
    container_name: geedsan-dev-odoo
    restart: unless-stopped
    command: ["odoo", "--database=odoo", "--db-filter=^odoo$$"]
    volumes:
      - ./addons:/mnt/extra-addons
      - geedsan_dev_odoo_data:/var/lib/odoo
    environment:
      HOST:           postgres
      PORT:           5432
      USER:           geedsan_dev
      PASSWORD:       ${DB_PASSWORD}
      ADMIN_PASSWORD: ${ODOO_ADMIN_PASSWORD}
    ports:
      - "8070:8069"
    networks:
      - geedsan-dev-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8069/web/health >/dev/null || wget -q -O /dev/null http://localhost:8069/web/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ── ChirpStack LoRaWAN NS ───────────────────────────────────────────────────
  chirpstack:
    image: chirpstack/chirpstack:4
    container_name: geedsan-dev-chirpstack
    restart: unless-stopped
    command: ["-c", "/etc/chirpstack"]
    volumes:
      # Same non-secret configs as production; deploy/chirpstack/secrets.toml
      # is generated separately per clone (gitignored) — see docs/DEV_ENVIRONMENT.md
      - ./deploy/chirpstack:/etc/chirpstack:ro
    environment:
      CHIRPSTACK_POSTGRESQL__DSN: "postgres://chirpstack:${CHIRPSTACK_DB_PASSWORD}@postgres:5432/chirpstack_dev?sslmode=disable"
      CHIRPSTACK_REDIS__SERVERS:  "redis://default:${REDIS_PASSWORD}@redis:6379/1"
      CHIRPSTACK_API__SECRET:    ${CHIRPSTACK_API_SECRET}
      CHIRPSTACK_INTEGRATION__MQTT__USERNAME: ${MQTT_CHIRPSTACK_USERNAME}
      CHIRPSTACK_INTEGRATION__MQTT__PASSWORD: ${MQTT_CHIRPSTACK_PASSWORD}
      CHIRPSTACK_REGIONS__EU868__GATEWAY__BACKEND__MQTT__USERNAME: ${MQTT_CHIRPSTACK_USERNAME}
      CHIRPSTACK_REGIONS__EU868__GATEWAY__BACKEND__MQTT__PASSWORD: ${MQTT_CHIRPSTACK_PASSWORD}
    ports:
      - "8081:8080"
    networks:
      - geedsan-dev-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "grep -q ':1F90 ' /proc/net/tcp6 2>/dev/null || grep -q ':1F90 ' /proc/net/tcp 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Nginx reverse proxy (dev — simplified, no Cloudflare/cert-switching) ────
  nginx:
    build:
      context: ./deploy/nginx-dev
      dockerfile: Dockerfile
    image: nuwaco-nginx:dev
    container_name: geedsan-dev-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    networks:
      - geedsan-dev-network
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  geedsan-dev-network:
    name: geedsan_dev_network
    driver: bridge

volumes:
  geedsan_dev_postgres_data:
    name: geedsan_dev_postgres_data
  geedsan_dev_redis_data:
    name: geedsan_dev_redis_data
  geedsan_dev_mosquitto_data:
    name: geedsan_dev_mosquitto_data
  geedsan_dev_mosquitto_log:
    name: geedsan_dev_mosquitto_log
  geedsan_dev_backend_uploads:
    name: geedsan_dev_backend_uploads
  geedsan_dev_backend_reports:
    name: geedsan_dev_backend_reports
  geedsan_dev_backend_logs:
    name: geedsan_dev_backend_logs
  geedsan_dev_odoo_data:
    name: geedsan_dev_odoo_data
