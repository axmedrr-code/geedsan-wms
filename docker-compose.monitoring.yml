# docker-compose.monitoring.yml
#
# NUWACO WMS — Monitoring Stack
# Run alongside the production stack (docker-compose.prod.yml).
#
# Start:
#   docker compose -f docker-compose.monitoring.yml --env-file .env.production up -d
#
# Access Grafana (via SSH tunnel for security):
#   ssh -L 3001:localhost:3001 user@<server>
#   Open: http://localhost:3001  (admin / $GRAFANA_ADMIN_PASSWORD)

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  # ── Prometheus ────────────────────────────────────────────────────────────
  prometheus:
    container_name: geedsan-prometheus
    image: prom/prometheus:v2.51.2
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--storage.tsdb.retention.size=8GB"
      - "--web.enable-lifecycle"
      - "--web.enable-admin-api"
    volumes:
      - ./deploy/monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    restart: unless-stopped
    networks:
      - monitoring
      - prod_network
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Grafana ───────────────────────────────────────────────────────────────
  grafana:
    container_name: geedsan-grafana
    image: grafana/grafana:10.4.3
    environment:
      GF_SECURITY_ADMIN_USER:         admin
      GF_SECURITY_ADMIN_PASSWORD:     ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP:         "false"
      GF_AUTH_ANONYMOUS_ENABLED:      "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_SERVER_HTTP_PORT:            "3001"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/monitoring/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    restart: unless-stopped
    networks:
      - monitoring
    depends_on:
      prometheus:
        condition: service_healthy
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Alertmanager ─────────────────────────────────────────────────────────
  alertmanager:
    container_name: geedsan-alertmanager
    image: prom/alertmanager:v0.27.0
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--log.level=info"
    volumes:
      - ./deploy/monitoring/alertmanager:/etc/alertmanager:ro
      - alertmanager_data:/alertmanager
    restart: unless-stopped
    networks:
      - monitoring
    logging: *default-logging

  # ── Node Exporter (host metrics: CPU, RAM, disk, network) ────────────────
  node_exporter:
    container_name: geedsan-node-exporter
    image: prom/node-exporter:v1.8.1
    command:
      - "--path.procfs=/host/proc"
      - "--path.rootfs=/rootfs"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
      - "--collector.netclass.ignored-devices=^(veth|br|docker|lo).*$$"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    restart: unless-stopped
    networks:
      - monitoring
    pid: host
    logging: *default-logging

  # ── cAdvisor (Docker container metrics) ──────────────────────────────────
  cadvisor:
    container_name: geedsan-cadvisor
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    command:
      - "--housekeeping_interval=30s"
      - "--docker_only=true"
      - "--store_container_labels=false"
      - "--whitelisted_container_labels=com.docker.compose.service,com.docker.compose.project"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    restart: unless-stopped
    privileged: true
    networks:
      - monitoring
      - prod_network
    logging: *default-logging

  # ── PostgreSQL Exporter ───────────────────────────────────────────────────
  postgres_exporter:
    container_name: geedsan-postgres-exporter
    image: prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      # geedsan is the superuser — can read pg_stat_* views for all databases
      DATA_SOURCE_NAME: "postgresql://geedsan:${DB_PASSWORD}@postgres:5432/geedsan_wms?sslmode=disable"
    restart: unless-stopped
    networks:
      - monitoring
      - prod_network
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9187/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Redis Exporter ────────────────────────────────────────────────────────
  redis_exporter:
    container_name: geedsan-redis-exporter
    image: oliver006/redis_exporter:v1.61.0
    environment:
      REDIS_ADDR:     "redis://redis:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    restart: unless-stopped
    networks:
      - monitoring
      - prod_network
    logging: *default-logging

  # ── Nginx Exporter ────────────────────────────────────────────────────────
  # Requires stub_status endpoint — see deploy/monitoring/nginx/stub-status.conf
  nginx_exporter:
    container_name: geedsan-nginx-exporter
    image: nginx/nginx-prometheus-exporter:1.1.0
    command:
      - "--nginx.scrape-uri=http://nginx:8081/nginx_status"
      - "--web.listen-address=:9113"
    restart: unless-stopped
    networks:
      - monitoring
      - prod_network
    logging: *default-logging

  # ── Blackbox Exporter (HTTP probes, SSL cert expiry, TCP) ─────────────────
  blackbox_exporter:
    container_name: geedsan-blackbox-exporter
    image: prom/blackbox-exporter:v0.25.0
    command:
      - "--config.file=/etc/blackbox/blackbox.yml"
      - "--log.level=info"
    volumes:
      - ./deploy/monitoring/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    restart: unless-stopped
    networks:
      - monitoring
      - prod_network
    logging: *default-logging

# ── Volumes ────────────────────────────────────────────────────────────────
volumes:
  prometheus_data:
    name: geedsan_prometheus_data
  grafana_data:
    name: geedsan_grafana_data
  alertmanager_data:
    name: geedsan_alertmanager_data

# ── Networks ───────────────────────────────────────────────────────────────
networks:
  monitoring:
    name: geedsan_monitoring
    driver: bridge

  # Join the production network so monitoring can reach internal services
  # (postgres:5432, redis:6379, nginx:80/8081, mosquitto:1883, etc.)
  prod_network:
    name: geedsan_default
    external: true
