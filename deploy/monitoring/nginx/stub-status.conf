# deploy/monitoring/nginx/stub-status.conf
#
# Nginx stub_status for prometheus nginx_exporter.
# Listens on internal port 8081 — NOT exposed to the internet.
#
# ── Setup ────────────────────────────────────────────────────────────────────
# 1. Mount this file in docker-compose.prod.yml nginx service volumes:
#
#      - ./deploy/monitoring/nginx/stub-status.conf:/etc/nginx/conf.d/stub-status.conf:ro
#
# 2. In docker-compose.prod.yml nginx service, expose port 8081 internally
#    (no ports mapping needed — containers on the same network can reach it):
#    (No change needed to `ports:` section — Docker network allows it.)
#
# 3. Reload nginx:
#      docker exec geedsan-nginx nginx -s reload

server {
    listen 8081;
    server_name _;

    access_log off;
    error_log  /dev/null;

    # Only allow scraping from within the Docker network
    allow 172.0.0.0/8;
    allow 10.0.0.0/8;
    allow 192.168.0.0/16;
    deny  all;

    location /nginx_status {
        stub_status on;
    }

    # Block all other requests
    location / {
        return 404;
    }
}
