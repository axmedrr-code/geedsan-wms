apiVersion: 1

datasources:
  - name:      Prometheus
    type:      prometheus
    uid:       prometheus
    url:       http://prometheus:9090
    access:    proxy
    isDefault: true
    editable:  false
    jsonData:
      timeInterval:         "15s"
      httpMethod:           POST
      prometheusType:       Prometheus
      prometheusVersion:    "2.51.0"
      cacheLevel:           Low
      incrementalQuerying:  true
