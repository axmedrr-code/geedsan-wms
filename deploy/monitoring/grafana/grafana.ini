[server]
http_port = 3001
# No domain — access via SSH tunnel only (security hardening)
# To expose via nginx, set root_url and configure a proxy in conf.d/
root_url = http://localhost:3001

[analytics]
reporting_enabled     = false
check_for_updates     = false
check_for_plugin_updates = false

[security]
admin_user              = admin
cookie_secure           = false   # true if serving over HTTPS
cookie_samesite         = lax
disable_gravatar        = true
x_content_type_options  = true
x_xss_protection        = true

[users]
allow_sign_up       = false
allow_org_create    = false
default_theme       = dark

[auth]
login_cookie_name   = grafana_session
login_maximum_inactive_lifetime_days = 7

[auth.anonymous]
enabled = false

[dashboards]
default_home_dashboard_path = /etc/grafana/provisioning/dashboards/wms-overview.json

[alerting]
enabled = true

[unified_alerting]
enabled = false

[log]
mode  = console
level = warn

[paths]
data         = /var/lib/grafana
logs         = /var/log/grafana
plugins      = /var/lib/grafana/plugins
provisioning = /etc/grafana/provisioning
