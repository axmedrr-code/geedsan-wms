# ============================================================
# geedsan.com / www.geedsan.com — apex + www
#
# The root location block is generated at container start by start.sh into
# /etc/nginx/active/root-website.conf, based on the WEBSITE_TARGET env var
# (see .env.production):
#   - WEBSITE_TARGET set   -> 302 (temporary) redirect to that host
#   - WEBSITE_TARGET unset -> serves deploy/nginx/landing/index.html
# ============================================================

server {
    listen 80;
    server_name geedsan.com www.geedsan.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name geedsan.com www.geedsan.com;

    ssl_certificate     /etc/letsencrypt/live/geedsan-wms/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/geedsan-wms/privkey.pem;

    access_log /dev/stdout                    cloudflare;
    access_log /var/log/nginx/root.access.log cloudflare;
    error_log  /var/log/nginx/root.error.log  warn;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff"                                      always;

    if ($method_blocked) { return 405; }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    include /etc/nginx/generated/root-website.conf;
}
