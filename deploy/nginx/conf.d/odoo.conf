# ============================================================
# odoo.geedsan.com — Odoo 18 ERP (internal admin access)
#
# IP ALLOWLIST (recommended):
#   Restrict this subdomain to known office / VPN IP addresses.
#   To enable: uncomment the two lines in the ALLOWLIST block below
#   and replace the example IPs with your actual addresses.
#   To disable: leave all allow/deny lines commented out.
#   Changes take effect on nginx reload — no rebuild needed.
# ============================================================

server {
    listen 80;
    server_name odoo.geedsan.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name odoo.geedsan.com;

    ssl_certificate         /etc/letsencrypt/live/geedsan-wms/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/geedsan-wms/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/geedsan-wms/chain.pem;

    access_log /dev/stdout                     cloudflare;
    access_log /var/log/nginx/odoo.access.log  cloudflare;
    error_log  /var/log/nginx/odoo.error.log   warn;

    client_max_body_size 200m;  # Odoo supports large attachments and bulk imports

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"                             always;
    add_header X-Frame-Options           "SAMEORIGIN"                          always;

    # Method restriction
    if ($method_blocked) { return 405; }

    # Block hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── ALLOWLIST ────────────────────────────────────────────────────────────
    # Uncomment and edit to restrict access to known admin IPs.
    # Multiple allow lines are supported (one IP or CIDR per line).
    # The deny all MUST be the last line in the block.
    #
    # allow 203.0.113.10;      # Example: office public IP
    # allow 198.51.100.0/24;   # Example: VPN CIDR
    # deny  all;

    # ── Odoo web interface ───────────────────────────────────────────────────
    location / {
        proxy_pass         http://odoo_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_set_header   X-Forwarded-Host   $host;
        # Odoo report generation and bulk imports can take several minutes
        proxy_read_timeout    720s;
        proxy_connect_timeout 720s;
        proxy_send_timeout    720s;
        proxy_buffering       off;
    }

    # ── Odoo long-polling (WebSocket / real-time bus) ────────────────────────
    # /longpolling and /web/dataset/call_kw use persistent connections.
    # WebSocket upgrade headers are required for the Odoo 16+ event bus.
    location /longpolling {
        proxy_pass         http://odoo_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade            $http_upgrade;
        proxy_set_header   Connection         "upgrade";
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_read_timeout 3600s;
        proxy_buffering    off;
    }

    # ── Odoo static assets — cache aggressively ──────────────────────────────
    location ~* /web/static/ {
        proxy_pass   http://odoo_upstream;
        proxy_buffering on;
        add_header   Cache-Control "public, max-age=86400";
        access_log   off;
    }
}
