# ============================================================
# wms.geedsan.com — NUWACO WMS Frontend (Next.js)
#
# This server block serves ONLY the frontend application.
# The backend API is on api.geedsan.com (see api.conf).
# ============================================================

# ── HTTP: redirect all → HTTPS; handle nginx health probe ───────────────────
server {
    # default_server: requests with unknown Host (e.g. Docker healthcheck
    # sending Host: localhost) land here instead of an alphabetically-earlier
    # conf that would redirect to HTTPS and break the probe.
    listen 80 default_server;
    server_name wms.geedsan.com;

    # ACME HTTP-01 challenge (fallback to webroot; Cloudflare DNS challenge
    # is preferred in Phase 4 and does not need this to be proxied).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        access_log off;
    }

    # nginx self-health: returns 200 directly — no backend dependency.
    # Used by docker-compose healthcheck and uptime monitors.
    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS: WMS frontend ──────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name wms.geedsan.com;

    # Single SAN cert covers all four geedsan.com subdomains (issued by setup-ssl.sh).
    ssl_certificate         /etc/letsencrypt/live/geedsan-wms/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/geedsan-wms/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/geedsan-wms/chain.pem;

    # Two access_log directives: per-service file (persistent, for Phase 9
    # log aggregation) and stdout (captured by Docker json-file driver).
    access_log /dev/stdout                    cloudflare;
    access_log /var/log/nginx/wms.access.log  cloudflare;
    error_log  /var/log/nginx/wms.error.log   warn;

    client_max_body_size 10m;

    # ── Security headers ────────────────────────────────────────────────────
    add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options     "nosniff"                                      always;
    add_header X-Frame-Options            "SAMEORIGIN"                                   always;
    add_header X-XSS-Protection           "1; mode=block"                                always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"              always;
    add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()"     always;

    # ── Method restriction ───────────────────────────────────────────────────
    # Block TRACE (Cross-Site Tracing) and CONNECT (HTTP tunneling).
    # Defined in nginx.conf as map $request_method $method_blocked.
    if ($method_blocked) { return 405; }

    # ── Hidden file protection ───────────────────────────────────────────────
    # Prevents access to .env, .git, .htaccess, etc. if they exist in the
    # Next.js build output.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── Next.js static assets ────────────────────────────────────────────────
    # _next/static paths use content hashes in the filename, so they are safe
    # to cache for 1 year. This must come before the catch-all location /.
    location ^~ /_next/static/ {
        proxy_pass http://frontend;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ── Frontend (all remaining paths) ───────────────────────────────────────
    location / {
        limit_req zone=general burst=60 nodelay;

        proxy_pass         http://frontend;
        proxy_http_version 1.1;
        # WebSocket headers — required for Next.js HMR and any real-time routes
        proxy_set_header   Upgrade            $http_upgrade;
        proxy_set_header   Connection         "upgrade";
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
