# ============================================================
# api.geedsan.com — NUWACO WMS Backend API (Node.js)
#
# Handles all backend API calls. The frontend is built with
# NEXT_PUBLIC_API_URL=https://api.geedsan.com so all /api/*
# fetch calls resolve here, not to wms.geedsan.com.
# ============================================================

server {
    listen 80;
    server_name api.geedsan.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.geedsan.com;

    ssl_certificate         /etc/letsencrypt/live/geedsan-wms/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/geedsan-wms/privkey.pem;
    # No ssl_trusted_certificate: Cloudflare Origin Certificates don't ship a
    # separate intermediate chain the way Let's Encrypt does, and OCSP
    # stapling for the origin leg isn't consumed by end users anyway — only
    # Cloudflare's edge-facing certificate is, which Cloudflare manages itself.

    access_log /dev/stdout                    cloudflare;
    access_log /var/log/nginx/api.access.log  cloudflare;
    error_log  /var/log/nginx/api.error.log   warn;

    client_max_body_size 50m;  # Allows bulk meter imports and file uploads

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff"                                      always;

    # Method restriction — block TRACE and CONNECT (see nginx.conf map)
    if ($method_blocked) { return 405; }

    # Block hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── Health: unrestricted, no rate limit ──────────────────────────────────
    # Used by Docker healthcheck and uptime monitors.
    location = /health {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
        access_log off;
    }

    # ── Auth endpoints: strict rate limit ────────────────────────────────────
    # 5 req/min with burst 10 — brute-force protection on login/refresh/reset.
    location /api/auth/ {
        limit_req zone=login burst=10 nodelay;

        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_set_header   Connection         '';
        proxy_read_timeout 30s;
    }

    # ── General API: standard rate limit ─────────────────────────────────────
    # 60 req/min with burst 30.
    location /api/ {
        limit_req zone=api burst=30 nodelay;

        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_set_header   Connection         '';
        proxy_buffering    off;
        proxy_read_timeout 120s;   # Long-running invoice generation / report exports
    }

    # ── PDF reports and uploaded files ───────────────────────────────────────
    location /reports/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_read_timeout 60s;
        add_header         Cache-Control "private, max-age=3600";
    }

    location /uploads/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_read_timeout 60s;
        add_header         Cache-Control "private, max-age=3600";
    }
}
