# ============================================================
# lns.geedsan.com — ChirpStack LoRaWAN Network Server admin UI
#
# IP ALLOWLIST (recommended):
#   Uncomment and edit the allow/deny block below to restrict
#   access to known admin IP addresses. No rebuild required —
#   changes take effect on: docker exec geedsan-nginx nginx -s reload
# ============================================================

server {
    listen 80;
    server_name lns.geedsan.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name lns.geedsan.com;

    ssl_certificate         /etc/letsencrypt/live/geedsan-wms/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/geedsan-wms/privkey.pem;
    # No ssl_trusted_certificate: Cloudflare Origin Certificates don't ship a
    # separate intermediate chain the way Let's Encrypt does, and OCSP
    # stapling for the origin leg isn't consumed by end users anyway — only
    # Cloudflare's edge-facing certificate is, which Cloudflare manages itself.

    access_log /dev/stdout                           cloudflare;
    access_log /var/log/nginx/chirpstack.access.log  cloudflare;
    error_log  /var/log/nginx/chirpstack.error.log   warn;

    client_max_body_size 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"                             always;
    add_header X-Frame-Options           "SAMEORIGIN"                          always;

    if ($method_blocked) { return 405; }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── ALLOWLIST ────────────────────────────────────────────────────────────
    # allow 203.0.113.10;      # Example: office public IP
    # deny  all;

    # ── ChirpStack gRPC-gateway (REST API + Web UI) ──────────────────────────
    # The ChirpStack UI uses gRPC-Web which requires WebSocket upgrade support.
    location / {
        proxy_pass         http://chirpstack_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade            $http_upgrade;
        proxy_set_header   Connection         "upgrade";
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_read_timeout 3600s;
        proxy_buffering    off;
    }
}
