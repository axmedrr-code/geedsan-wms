user  nginx;
worker_processes  auto;
error_log  /dev/stderr warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    multi_accept on;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Logging ─────────────────────────────────────────────────────────────
    # After Cloudflare real-IP restoration, $remote_addr holds the visitor IP.
    # CF-Connecting-IP is also logged directly as a cross-check.
    log_format cloudflare '$remote_addr - $remote_user [$time_local] '
                          '"$request" $status $body_bytes_sent '
                          '"$http_referer" "$http_user_agent" '
                          'cf_ray=$http_cf_ray rt=$request_time '
                          'upstream=$upstream_addr';

    # Main log → Docker stdout (captured by json-file logging driver).
    # Per-server access_log directives add a SECOND write to a named file —
    # the main log still fires, so both streams are populated.
    access_log /dev/stdout cloudflare;

    sendfile       on;
    tcp_nopush     on;
    tcp_nodelay    on;
    keepalive_timeout 65;
    server_tokens  off;   # Never advertise nginx version in headers / error pages

    # ── Security: request sizing ────────────────────────────────────────────
    # Prevents buffer-overflow probes on URI and header fields.
    large_client_header_buffers 4 16k;
    client_header_buffer_size   1k;

    # ── Security: block dangerous HTTP methods globally ──────────────────────
    # TRACE enables Cross-Site Tracing (XST). CONNECT is used for HTTP
    # tunneling — neither is a legitimate method for any service in this stack.
    # Each HTTPS server block applies this map via: if ($method_blocked) { ... }
    map $request_method $method_blocked {
        default  0;
        TRACE    1;
        CONNECT  1;
    }

    # ── Gzip compression ────────────────────────────────────────────────────
    # Only text-based types are listed. Images (jpeg, png, gif, webp),
    # archives (zip, gz, tar), and binary formats are intentionally excluded —
    # they are already compressed and gzip would waste CPU for no gain.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml
        font/woff2;

    # ── Cloudflare real IP restoration ──────────────────────────────────────
    # All inbound connections come from Cloudflare edge nodes, not the visitor.
    # set_real_ip_from declares CF IP ranges as trusted proxies; nginx then
    # replaces $remote_addr with the value of CF-Connecting-IP so rate-limiting
    # zones and access logs reflect the actual visitor IP.
    # Source: https://www.cloudflare.com/ips/ (updated 2024)
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header   CF-Connecting-IP;

    # ── Rate limiting zones ──────────────────────────────────────────────────
    # Keyed on the real visitor IP (after Cloudflare restoration above).
    # Burst allows short spikes without immediate rejection.
    limit_req_zone $binary_remote_addr zone=login:10m   rate=5r/m;    # Auth endpoints
    limit_req_zone $binary_remote_addr zone=api:10m     rate=60r/m;   # API endpoints
    limit_req_zone $binary_remote_addr zone=general:20m rate=120r/m;  # Page loads
    limit_req_status 429;

    # ── TLS global settings ──────────────────────────────────────────────────
    ssl_session_cache   shared:SSL:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;  # Forward secrecy: don't reuse session keys

    ssl_protocols        TLSv1.2 TLSv1.3;
    # Mozilla "Intermediate" cipher list — TLS 1.2 compatibility + strong ciphers
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    # OCSP stapling: caches the CA's revocation response locally so browsers
    # don't need an extra round-trip to the CA to verify the cert is valid.
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout    5s;

    # ── Upstream services ────────────────────────────────────────────────────
    # All names resolve via Docker's internal bridge DNS.
    # keepalive = persistent HTTP/1.1 connections to upstream reduce TCP overhead.
    upstream frontend {
        server frontend:3000;
        keepalive 32;
    }

    upstream backend {
        server backend:5000;
        keepalive 32;
    }

    upstream odoo_upstream {
        server odoo:8069;
        keepalive 16;
    }

    upstream chirpstack_upstream {
        server chirpstack:8080;
        keepalive 8;
    }

    # Populated at container startup by start.sh — either the HTTP-only or HTTPS
    # conf files are copied here depending on whether SSL certificates exist.
    include /etc/nginx/active/*.conf;
}
