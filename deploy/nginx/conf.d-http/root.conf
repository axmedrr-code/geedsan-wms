# ============================================================
# geedsan.com / www.geedsan.com — HTTP-only mode
#
# Active when SSL certificates do not yet exist or are invalid.
# Root location generated by start.sh — see deploy/nginx/conf.d/root.conf.
# ============================================================

server {
    listen 80;
    server_name geedsan.com www.geedsan.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        access_log off;
    }

    include /etc/nginx/generated/root-website.conf;
}
