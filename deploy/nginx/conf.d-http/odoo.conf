# ============================================================
# odoo.geedsan.com — HTTP-only mode
#
# Active when SSL certificates do not yet exist or are invalid.
# The nginx entrypoint (start.sh) swaps this file for the HTTPS
# version automatically when certificates are present.
# ============================================================

server {
    listen 80;
    server_name odoo.geedsan.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        access_log off;
    }

    # Method restriction
    if ($method_blocked) { return 405; }

    # Block hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # IP ALLOWLIST (recommended in production — uncomment when certs are in place):
    # allow 203.0.113.10;      # Example: office public IP
    # allow 198.51.100.0/24;   # Example: VPN CIDR
    # deny  all;

    # Odoo web interface
    location / {
        proxy_pass         http://odoo_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_set_header   X-Forwarded-Host   $host;
        proxy_read_timeout    720s;
        proxy_connect_timeout 720s;
        proxy_send_timeout    720s;
        proxy_buffering       off;
    }

    # Odoo long-polling (WebSocket / real-time bus)
    location /longpolling {
        proxy_pass         http://odoo_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade            $http_upgrade;
        proxy_set_header   Connection         "upgrade";
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_read_timeout 3600s;
        proxy_buffering    off;
    }

    # Odoo static assets
    location ~* /web/static/ {
        proxy_pass   http://odoo_upstream;
        proxy_buffering on;
        add_header   Cache-Control "public, max-age=86400";
        access_log   off;
    }
}
