# ============================================================
# wms.geedsan.com — HTTP-only mode
#
# Active when SSL certificates do not yet exist or are invalid.
# The nginx entrypoint (start.sh) swaps this file for the HTTPS
# version automatically when certificates are present.
# ============================================================

server {
    # default_server: Docker healthcheck sends Host: localhost — must land here,
    # not in one of the non-default server blocks.
    listen 80 default_server;
    server_name wms.geedsan.com;

    # ACME HTTP-01 challenge (used by certbot webroot mode)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        access_log off;
    }

    # nginx self-health: used by docker-compose healthcheck and uptime monitors
    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Method restriction — block TRACE and CONNECT (defined in nginx.conf)
    if ($method_blocked) { return 405; }

    # Block hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Next.js static assets — safe to cache for 1 year (content-hashed filenames)
    location ^~ /_next/static/ {
        proxy_pass http://frontend;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Frontend (all remaining paths)
    location / {
        limit_req zone=general burst=60 nodelay;

        proxy_pass         http://frontend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade            $http_upgrade;
        proxy_set_header   Connection         "upgrade";
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
