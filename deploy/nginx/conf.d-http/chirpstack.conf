# ============================================================
# lns.geedsan.com — HTTP-only mode
#
# Active when SSL certificates do not yet exist or are invalid.
# The nginx entrypoint (start.sh) swaps this file for the HTTPS
# version automatically when certificates are present.
# ============================================================

server {
    listen 80;
    server_name lns.geedsan.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        access_log off;
    }

    # Method restriction
    if ($method_blocked) { return 405; }

    # Block hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # IP ALLOWLIST (recommended in production — uncomment when certs are in place):
    # allow 203.0.113.10;      # Example: office public IP
    # deny  all;

    # ChirpStack gRPC-gateway (REST API + Web UI) — requires WebSocket upgrade
    location / {
        proxy_pass         http://chirpstack_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade            $http_upgrade;
        proxy_set_header   Connection         "upgrade";
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_read_timeout 3600s;
        proxy_buffering    off;
    }
}
