# ============================================================
# api.geedsan.com — HTTP-only mode
#
# Active when SSL certificates do not yet exist or are invalid.
# The nginx entrypoint (start.sh) swaps this file for the HTTPS
# version automatically when certificates are present.
# ============================================================

server {
    listen 80;
    server_name api.geedsan.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        access_log off;
    }

    # Method restriction
    if ($method_blocked) { return 405; }

    # Block hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Health: unrestricted, no rate limit
    location = /health {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
        access_log off;
    }

    # Auth endpoints: strict rate limit (5 req/min, burst 10)
    location /api/auth/ {
        limit_req zone=login burst=10 nodelay;

        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_set_header   Connection         '';
        proxy_read_timeout 30s;
    }

    # General API: standard rate limit (60 req/min, burst 30)
    location /api/ {
        limit_req zone=api burst=30 nodelay;

        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_set_header   Connection         '';
        proxy_buffering    off;
        proxy_read_timeout 120s;
    }

    location /reports/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_read_timeout 60s;
        add_header         Cache-Control "private, max-age=3600";
    }

    location /uploads/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_read_timeout 60s;
        add_header         Cache-Control "private, max-age=3600";
    }
}
