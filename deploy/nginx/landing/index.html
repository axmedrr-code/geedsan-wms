<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Geedsan Enterprise Platform</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 34rem;
    margin: 4rem auto;
    padding: 0 1.5rem;
    color: #1a1a1a;
    background: #fff;
  }
  h1 { font-size: 1.5rem; margin: 0 0 0.25rem; }
  p.lead { color: #555; margin: 0 0 2rem; }
  .services { display: flex; flex-direction: column; gap: 0.75rem; list-style: none; padding: 0; margin: 0; }
  .service {
    display: block;
    padding: 0.9rem 1.1rem;
    border: 1px solid #d8d8d8;
    border-radius: 8px;
    text-decoration: none;
    color: #1a1a1a;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .service:hover { border-color: #999; background: #fafafa; }
  .service strong { display: block; font-size: 1rem; }
  .service span { display: block; font-size: 0.85rem; color: #666; margin-top: 0.15rem; }
  @media (prefers-color-scheme: dark) {
    body { background: #12141a; color: #e8e8e8; }
    p.lead { color: #a0a0a8; }
    .service { border-color: #33363f; color: #e8e8e8; }
    .service:hover { border-color: #55585f; background: #1a1d24; }
    .service span { color: #9a9da5; }
  }
</style>
</head>
<body>
  <h1>Geedsan Enterprise Platform</h1>
  <p class="lead">Welcome to Geedsan Enterprise Platform. Please select a service.</p>
  <ul class="services">
    <li><a class="service" href="https://wms.geedsan.com">
      <strong>WMS</strong>
      <span>Warehouse Management System</span>
    </a></li>
    <li><a class="service" href="https://erp.geedsan.com">
      <strong>ERP</strong>
      <span>Odoo Enterprise Resource Planning</span>
    </a></li>
    <li><a class="service" href="https://api.geedsan.com/health">
      <strong>API</strong>
      <span>Backend API status</span>
    </a></li>
  </ul>
</body>
</html>
