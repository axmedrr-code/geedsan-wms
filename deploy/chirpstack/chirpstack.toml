# Non-secret ChirpStack v4 configuration.
#
# Connection strings and the API JWT secret are injected via environment
# variables (see docker-compose.prod.yml) — no credentials live here.
#
# MQTT credentials are also injected via env vars:
#   CHIRPSTACK_INTEGRATION__MQTT__USERNAME / __PASSWORD
# so this file can be committed to git without exposing secrets.

[logging]
level="info"

[network]
net_id="000000"
enabled_regions=[
  "eu868",
]

[api]
bind="0.0.0.0:8080"
# Placeholder — overridden at runtime by CHIRPSTACK_API__SECRET env var
secret=""

[integration]
enabled=["mqtt"]
# [integration.mqtt] sub-section is in deploy/chirpstack/secrets.toml (gitignored)
# so credentials are not committed to the repository.
