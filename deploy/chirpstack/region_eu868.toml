[[regions]]
id="eu868"
description="EU868"
common_name="EU868"

[regions.gateway.backend.mqtt]
# Hostname — resolves correctly on Linux Docker bridge (no static IPs needed)
server="tcp://mosquitto:1883/"
# Gateway-backend MQTT credentials — service-to-service, internal broker only.
# Injected at runtime via CHIRPSTACK_REGIONS__EU868__GATEWAY__BACKEND__MQTT__USERNAME
# and __PASSWORD (see docker-compose.prod.yml), sourced from MQTT_CHIRPSTACK_USERNAME /
# MQTT_CHIRPSTACK_PASSWORD in .env.production. Left blank here so no credential is
# committed to git — placeholders are always overridden before ChirpStack starts.
username=""
password=""
